<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vans Inspired E-Commerce Store</title>
    <style>
        /* Global Styles & Variables */
        :root {
            --vans-red: #c8102e;
            --dark-gray: #111111;
            --light-gray: #f5f5f5;
            --border-color: #e5e5e5;
            --text-color: #222222;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }

        body {
            color: var(--text-color);
            background-color: #ffffff;
            overflow-x: hidden;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Top Notification Banner */
        .promo-banner {
            background-color: var(--vans-red);
            color: #ffffff;
            text-align: center;
            padding: 10px 0;
            font-size: 0.85rem;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Navigation Header */
        header {
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            background: #ffffff;
            z-index: 999;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
        }

        .logo {
            font-size: 2rem;
            font-weight: 900;
            letter-spacing: -1px;
            color: var(--vans-red);
            cursor: pointer;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 25px;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.9rem;
        }

        .nav-links li:hover {
            color: var(--vans-red);
            cursor: pointer;
        }

        .cart-icon-container {
            position: relative;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .cart-badge {
            background-color: var(--vans-red);
            color: white;
            border-radius: 50%;
            padding: 2px 7px;
            font-size: 0.75rem;
        }

        /* Hero Spotlight */
        .hero {
            background-color: var(--light-gray);
            padding: 60px 0;
            display: flex;
            align-items: center;
            min-height: 450px;
        }

        .hero-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            gap: 40px;
        }

        .hero-text {
            flex: 1;
        }

        .hero-text h1 {
            font-size: 3.5rem;
            font-weight: 900;
            line-height: 1.1;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .hero-text p {
            font-size: 1.1rem;
            margin-bottom: 25px;
            color: #555;
        }

        .hero-image {
            flex: 1;
            text-align: center;
        }

        .hero-image img {
            max-width: 100%;
            max-height: 300px;
            object-fit: contain;
            transition: transform 0.5s;
        }

        .hero-image img:hover {
            transform: scale(1.05);
        }

        .btn {
            display: inline-block;
            background-color: var(--dark-gray);
            color: white;
            padding: 15px 30px;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 1px;
            border: none;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: var(--vans-red);
        }

        /* Product Catalog Grid */
        .catalog {
            padding: 60px 0;
        }

        .section-title {
            font-size: 2rem;
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 40px;
            text-align: center;
            letter-spacing: 1px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
        }

        .product-card {
            border: 1px solid transparent;
            padding: 15px;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .product-card:hover {
            border-color: var(--border-color);
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }

        .product-img-wrapper {
            background-color: var(--light-gray);
            padding: 20px;
            text-align: center;
            margin-bottom: 15px;
            height: 220px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .product-img-wrapper img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .product-title {
            font-weight: 700;
            font-size: 1rem;
            margin-bottom: 5px;
            color: var(--dark-gray);
        }

        .product-price {
            color: var(--vans-red);
            font-weight: bold;
            margin-bottom: 15px;
        }

        .add-to-cart-btn {
            width: 100%;
            background-color: transparent;
            border: 2px solid var(--dark-gray);
            color: var(--dark-gray);
            padding: 10px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
        }

        .add-to-cart-btn:hover {
            background-color: var(--dark-gray);
            color: white;
        }

        /* Newsletter Signup Row */
        .newsletter-section {
            background-color: var(--dark-gray);
            color: white;
            padding: 60px 0;
            text-align: center;
        }

        .newsletter-section h2 {
            font-size: 1.8rem;
            text-transform: uppercase;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .newsletter-section p {
            color: #aaa;
            margin-bottom: 25px;
            font-size: 0.95rem;
        }

        .newsletter-form {
            display: flex;
            max-width: 500px;
            margin: 0 auto;
            gap: 10px;
        }

        .newsletter-form input {
            flex: 1;
            padding: 15px;
            border: none;
            font-size: 1rem;
            outline: none;
        }

        .newsletter-form button {
            background-color: var(--vans-red);
            color: white;
            border: none;
            padding: 0 30px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.2s;
        }

        .newsletter-form button:hover {
            background-color: #a00d24;
        }

        /* Shopping Cart Side Modal */
        .cart-modal {
            position: fixed;
            top: 0;
            right: -400px;
            width: 400px;
            height: 100%;
            background-color: white;
            box-shadow: -5px 0 15px rgba(0,0,0,0.1);
            z-index: 1000;
            transition: right 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .cart-modal.active {
            right: 0;
        }

        .cart-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cart-header h2 {
            text-transform: uppercase;
            font-size: 1.3rem;
        }

        .close-cart {
            font-size: 1.5rem;
            cursor: pointer;
        }

        .cart-items {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .cart-item {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
            align-items: center;
        }

        .cart-item img {
            width: 70px;
            height: 70px;
            object-fit: contain;
            background: var(--light-gray);
        }

        .cart-item-details {
            flex: 1;
        }

        .cart-item-title {
            font-weight: bold;
            font-size: 0.95rem;
        }

        .cart-item-price {
            color: var(--vans-red);
            font-size: 0.9rem;
            margin-top: 5px;
        }

        .remove-item {
            color: #888;
            cursor: pointer;
            font-size: 0.85rem;
            margin-top: 5px;
            display: inline-block;
        }

        .remove-item:hover {
            color: var(--vans-red);
        }

        .cart-footer {
            padding: 20px;
            border-top: 1px solid var(--border-color);
            background: var(--light-gray);
        }

        .cart-total {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            font-size: 1.2rem;
            margin-bottom: 15px;
        }

        .checkout-btn {
            width: 100%;
            background-color: var(--vans-red);
            color: white;
            border: none;
